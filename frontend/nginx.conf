# CHANGE [2026-08-30 12:58 +08:00] [WH400]: 为单页应用配置回退路由和静态资源缓存。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

