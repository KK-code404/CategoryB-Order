# CHANGE [2026-08-30 12:58 +08:00] [WH400]: Configure the migration entrypoint in ASCII for Windows locale compatibility; the environment overrides the database URL.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./categoryb.db

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
